version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: eventos-postgres
    environment:
      POSTGRES_DB: eventosbackend
      POSTGRES_USER: eventosbackend
      POSTGRES_PASSWORD: eventosbackend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
